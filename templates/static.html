<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved color scheme before first paint to avoid a flash.
      // Mirrors the `schema` key written by usehooks-ts (JSON-encoded).
      (function () {
        try {
          var raw = localStorage.getItem("schema");
          if (!raw) return;
          var value;
          try {
            value = JSON.parse(raw);
          } catch (e) {
            value = raw;
          }
          if (value === "light" || value === "dark") {
            document.documentElement.setAttribute("data-schema", value);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdgen</title>
    {{#if style}}
    <link rel="stylesheet" vite-ignore data-head href="/assets/custom.css" />
    {{/if}}
  </head>
  <body>
    <div id="root">{{{body}}}</div>
    <script type="module" src="../src/static.tsx"></script>
    <script id="data" type="application/json">
      {{{data}}}
    </script>
    <script id="runtime" type="application/json">
      {{{runtime}}}
    </script>
    <script id="content" type="application/text">
      {{{content}}}
    </script>
  </body>
</html>
